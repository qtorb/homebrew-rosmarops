# BV-167 §3: the formula on macOS (Apple silicon) and Linux (x86-64): build
# from source, brew test, no quarantine attribute, a real run with a report,
# the weekly-review command's path, and the integrity check after an upgrade.
# Read-only for every other repository: no tokens, no writes outside this run.
name: test
on:
  push:
    branches: [main, master, 'bv-*']
  pull_request:
permissions:
  contents: read
jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Homebrew on the PATH
        shell: bash
        run: |
          if ! command -v brew >/dev/null; then
            echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          fi
      - name: Local tap with this branch's formula
        shell: bash
        run: |
          set -euo pipefail
          brew tap-new --no-git qtorb/rosmarops
          TAP="$(brew --repository)/Library/Taps/qtorb/homebrew-rosmarops"
          echo "TAP=$TAP" >> "$GITHUB_ENV"
          # The previous release first, to check the integrity prompt after an upgrade.
          sed -e 's|v0.16.0.tar.gz|v0.15.0.tar.gz|' \
              -e 's|80c00b3ea5d488b0a1d31888d93d7de1d3f1299da1aa4a59d04bb324e18344bb|ad9a456968ba0b94550fc7ebc76450adc44fe93af32add9161ae554013e86906|' \
              Formula/rosmarops.rb > "$TAP/Formula/rosmarops.rb"
      - name: Install the previous release (0.15.0) and run it once
        shell: bash
        run: |
          set -euo pipefail
          brew install --build-from-source qtorb/rosmarops/rosmarops
          H="$RUNNER_TEMP/home"; mkdir -p "$H/projects/app"
          git -C "$H/projects/app" init -q
          echo "H=$H" >> "$GITHUB_ENV"
          HOME="$H" rosmarops init --repos-under "$H/projects"
          HOME="$H" rosmarops baseline
          HOME="$H" rosmarops run --lang en </dev/null
      - name: brew upgrade to this formula (build from source) and brew test
        shell: bash
        run: |
          set -euo pipefail
          cp Formula/rosmarops.rb "$TAP/Formula/rosmarops.rb"
          brew upgrade --build-from-source qtorb/rosmarops/rosmarops 2>&1 | tee "$RUNNER_TEMP/brew-install.txt"
          brew test qtorb/rosmarops/rosmarops 2>&1 | tee "$RUNNER_TEMP/brew-test.txt"
          rosmarops --version
      - name: No quarantine attribute (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for f in "$(brew --prefix)/bin/rosmarops" "$(brew --prefix rosmarops)/bin/rosmarops"; do
            xattr -l "$f"
            if xattr -p com.apple.quarantine "$f" 2>/dev/null; then
              echo "com.apple.quarantine on $f"; exit 1
            fi
          done
      - name: After the upgrade the integrity check asks to confirm, then the report
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/after-upgrade.txt"
          # The question is asked only on a console (canAsk, BV-52): give the run a
          # terminal with script(1), whose arguments differ on macOS and Linux. The
          # input stays open after the «y» so script(1) never sends the end of
          # input (^D) before the program reads the answer.
          # With a console, the run asks three things, each read as its own line:
          # the integrity confirmation («y»), whether Grok Bot is used («0», «I
          # don't know») and, since 0.15.0, usage statistics («n», so this job
          # never sends any).
          cmd="HOME='$H' rosmarops run --lang en"
          answers() { sleep 3; printf 'y\n'; sleep 1; printf '0\n'; sleep 1; printf 'n\n'; sleep 10; }
          if [ "$RUNNER_OS" = macOS ]; then
            answers | script -q /dev/null sh -c "$cmd" 2>&1 | tr -d '\r' | tee "$out"
          else
            answers | script -qec "$cmd" /dev/null 2>&1 | tr -d '\r' | tee "$out"
          fi
          grep -qF "RosmarOps has changed since the last run." "$out" || { echo "no integrity prompt after the upgrade"; exit 1; }
          grep -qF "Usage statistics: off." "$out" || { echo "usage statistics not answered no"; exit 1; }
          # Since 0.16.0 the reports are in ~/RosmarOps on Linux (moved once from
          # ~/.rosmarops/reports); on macOS they stay in ~/.rosmarops/reports.
          R=""
          for d in "$H/RosmarOps" "$H/.rosmarops/reports"; do
            if [ -s "$d/report.en.html" ]; then R="$d/report.en.html"; break; fi
          done
          test -n "$R" || { echo "no report"; exit 1; }
          echo "R=$R" >> "$GITHUB_ENV"
      - name: Weekly-review command points to the stable Homebrew path
        shell: bash
        run: |
          set -euo pipefail
          stable="$(brew --prefix)/bin/rosmarops"
          echo "stable path: $stable"
          grep -oE '[^ "<>]*/rosmarops/[0-9][^ "<>]*/bin/rosmarops|[^ "<>]*/bin/rosmarops' "$R" | sort -u || true
          if grep -q "/Cellar/rosmarops/" "$R"; then
            echo "the report's weekly-review command points into the Cellar"; exit 1
          fi
